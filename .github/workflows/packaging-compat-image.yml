name: packaging-compat image

on:
  push:
    branches:
      - packaging-compat-image

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build and push
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          version=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)"$/\1/p' build.gradle.kts | head -n 1)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/signal-cli:${version,,}-${GITHUB_SHA::12}"
          docker build -f packaging-compat.Containerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            -t "$image" .
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          {
            echo "Image: \`$image\`"
            echo
            echo "Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' "$image")\`"
          } >> "$GITHUB_STEP_SUMMARY"
